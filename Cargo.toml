[package]
name = "amrfinder-rs"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of NCBI AMRFinderPlus — antimicrobial resistance gene detection"
license-file = "LICENSE"
repository = "https://github.com/henriksson-lab/ncbi-amrfinderplus-rs"
readme = "README.md"
keywords = ["bioinformatics", "amr", "resistance", "blast", "genomics"]
categories = ["science", "command-line-utilities"]
include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "amrfinder"
path = "src/main.rs"

[lib]
name = "amrfinder"
path = "src/lib.rs"

[dependencies]
hmmer = { package = "hmmer-pure-rs", version = "0.7" }
ureq = "3"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
anyhow = "1"
